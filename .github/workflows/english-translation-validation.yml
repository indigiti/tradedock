name: English translation validation

on:
  push:
    branches:
      - translation/english-documentation-ui
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  macos-build-and-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify English documentation and UI-only edits
        run: python3 tools/check_english_translation.py
      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build solution
        run: dotnet build TradingHub.slnx --configuration Release
      - name: Run regression tests
        run: dotnet test tests/TradingHub.Tests --configuration Release --no-restore
      - name: Render headless UI smoke scenes (temporary fixtures)
        run: dotnet run --project tools/TradingHub.UiSnapshot -- /tmp/tradedock-english-ui 4 trading settings connections data strategies
      - name: Upload rendered UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradedock-english-ui-snapshots
          path: /tmp/tradedock-english-ui/
          if-no-files-found: warn
          retention-days: 7
